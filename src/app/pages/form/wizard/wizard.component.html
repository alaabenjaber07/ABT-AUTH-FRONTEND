<div class="container-fluid">
  <app-page-title title="Form Wizard" [breadcrumbItems]="breadCrumbItems"></app-page-title>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <div class="row">
      <div class="col-lg-12">
        <div class="card">
          <div class="card-body">
            <h4 class="card-title mb-4">Création utilisateur</h4>
            <aw-wizard [navBarLayout]="'large-empty-symbols'">
              <!-- Étape 1 -->
              <aw-wizard-step>
                <ng-template awWizardStepSymbol>
                  <i class="fas fa-user"></i>
                </ng-template>
                <div class="row">
                  <div class="col-12">
                    <div class="row mb-3">
                      <label class="col-md-3 col-form-label">Email *</label>
                      <div class="col-md-9">
                        <input class="form-control" formControlName="email" type="email" placeholder="Enter email">
                      </div>
                    </div>
                    <div class="row mb-3">
                      <label class="col-md-3 col-form-label">Nom d'utilisateur *</label>
                      <div class="col-md-9">
                        <input class="form-control" formControlName="username" type="text" placeholder="Enter Username">
                      </div>
                    </div>
                    <div class="row mb-3">
                      <label class="col-md-3 col-form-label">Mot de passe *</label>
                      <div class="col-md-9">
                        <input class="form-control" formControlName="password" type="password" placeholder="Enter Password">
                      </div>
                    </div>
                  </div>
                </div>
                <ul class="list-inline wizard mb-0">
                  <li class="next list-inline-item float-end">
                    <button class="btn btn-primary" awNextStep type="button">Suivant</button>
                  </li>
                </ul>
              </aw-wizard-step>

              <!-- Étape 2 -->
              <aw-wizard-step>
                <ng-template awWizardStepSymbol>
                  <i class="fas fa-user-circle"></i>
                </ng-template>
                <div class="row">
                  <div class="col-12">
                    <div class="row mb-3">
                      <label class="col-md-3 col-form-label">Prénom *</label>
                      <div class="col-md-9">
                        <input class="form-control" formControlName="firstName" type="text" placeholder="Enter first name">
                      </div>
                    </div>
                    <div class="row mb-3">
                      <label class="col-md-3 col-form-label">Nom *</label>
                      <div class="col-md-9">
                        <input class="form-control" formControlName="lastName" type="text" placeholder="Enter last name">
                      </div>
                    </div>
                    <div class="row mb-3">
                      <label class="col-md-3 col-form-label">Matricule</label>
                      <div class="col-md-9">
                        <input class="form-control" formControlName="matricule" type="text" placeholder="Matricule (facultatif)">
                      </div>
                    </div>
                  </div>
                </div>
                <ul class="list-inline wizard mb-0">
                  <li class="previous list-inline-item">
                    <button class="btn btn-secondary" awPreviousStep type="button">Précédent</button>
                  </li>
                  <li class="next list-inline-item float-end">
                    <button class="btn btn-primary" awNextStep type="button">Suivant</button>
                  </li>
                </ul>
              </aw-wizard-step>

              <!-- Étape 3 -->
              <aw-wizard-step>
                <ng-template awWizardStepSymbol>
                  <i class="fas fa-check-circle"></i>
                </ng-template>
                <div class="row">
                  <div class="col-12">
                    <div class="row mb-3">
                      <label class="col-md-3 col-form-label">Adresse</label>
                      <div class="col-md-9">
                        <input class="form-control" formControlName="address" type="text" placeholder="Adresse (facultatif)">
                      </div>
                    </div>
                    <div class="row mb-3">
                      <label class="col-md-3 col-form-label">Numéro de téléphone</label>
                      <div class="col-md-9">
                        <input class="form-control" formControlName="phoneNumber" type="text" placeholder="Numéro (facultatif)">
                      </div>
                    </div>
                    <div class="text-center">
                      <button class="btn btn-success mt-3" type="submit">Créer l'utilisateur</button>
                    </div>
                  </div>
                </div>
                <ul class="list-inline wizard mb-0">
                  <li class="previous list-inline-item">
                    <button class="btn btn-secondary" awPreviousStep type="button">Précédent</button>
                  </li>
                </ul>
              </aw-wizard-step>
            </aw-wizard>

            <!-- Message info -->
            <div *ngIf="message" class="alert alert-info mt-4">
              {{ message }}
            </div>
          </div>
        </div>
      </div>
    </div>
