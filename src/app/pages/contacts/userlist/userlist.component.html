  <div class="container-fluid">
    <app-page-title title="Liste des Utilisateurs" [breadcrumbItems]="breadCrumbItems"></app-page-title>

    <div *ngIf="loading" class="text-center my-3">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

  <div class="row" *ngIf="!loading && !errorMessage">
    <div class="col-lg-12">
      <div class="col-lg-12 my-3 d-flex justify-content-between align-items-center">
  <!-- Champ de recherche à gauche -->
  <input type="text"
         placeholder="Recherche par Login, Nom, Prénom..."
         [(ngModel)]="searchTerm"
         (input)="filterUsers()"
         class="form-control w-75" />

  <!-- Boutons à droite -->
  <div class="d-flex gap-2">
    <button class="btn btn-warning me-2" (click)="goToAddUser()">Ajouter Utilisateur</button>
    <button class="btn btn-warning" (click)="goToAssignRole()">Assigner Role</button>
  </div>
</div>

      <div class="card">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table  table-hover align-middle">
              <thead >
                <tr>
                  <th>Image</th>
                  <th>Login</th>
                  <th>Prénom</th>
                  <th>Nom</th>
                  <th>Email</th>
                  <th>Role</th>
                  <th>Matricule</th>
                  <th>Adresse</th>
                  <th>Téléphone</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let user of users">
                <td>
                  <div class="avatar-xs">
                    <!-- Remplacement par l'image statique -->
                    <img src="assets/images/users/userimage.png" alt="User Image" class="img-thumbnail rounded-circle img-large" />
                  </div>
                </td>

                  <!-- Attributs dynamiques -->
                  <td>{{ user.username }}</td>
                  <td>{{ user.firstName }}</td>
                  <td>{{ user.lastName }}</td>
                  <td>{{ user.email }}</td>
                  <td>{{user.role}}</td>
                  <td>{{ user.matricule }}</td>
                  <td>{{ user.address }}</td>
                  <td>{{ user.phoneNumber }}</td>

                 <!-- Actions -->
             <!-- Actions -->
                  <td>
                    <ul class="list-inline font-size-20 contact-links mb-0">
                      <li class="list-inline-item px-2">
                        <a (click)="deleteUser(user.idUserprofile)" ngbTooltip="Supprimer">
                          <i class="bx bx-trash"></i>
                        </a>
                      </li>
                      <li class="list-inline-item px-2">
                        <a [routerLink]="['/contacts/profile', user.idUserprofile]" ngbTooltip="Profile">
                          <i class="bx bx-user-circle"></i>
                        </a>
                      </li>
                       <li class="list-inline-item px-2">
                         <a (click)="goToEditUser(user.idUserprofile)" ngbTooltip="Modifier">
                            <i class="bx bx-edit-alt"></i>
                          </a>
                        </li>

                      </ul>
                    </td>



                  </tr>
                </tbody>
              </table>
            </div>

            

          </div>
        </div>
      </div>
    </div>
  </div>
