<div class="container-fluid">
  <app-page-title title="Users List" [breadcrumbItems]="breadCrumbItems"></app-page-title>

  <div *ngIf="loading" class="text-center my-3">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

  <div class="row" *ngIf="!loading && !errorMessage">
    <div class="col-lg-12">
      <div class="card">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
              <thead class="table-light">
                <tr>
                  <th>Image</th>
                  <th>Username</th>
                  <th>First Name</th>
                  <th>Last Name</th>
                  <th>Email</th>
                  <th>Matricule</th>
                  <th>Address</th>
                  <th>Phone Number</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let user of users">
                  <!-- Image statique -->
                  <td>
                    <div class="avatar-xs">
                      <span class="avatar-title rounded-circle">
                        U
                      </span>
                    </div>
                  </td>

                  <!-- Attributs dynamiques -->
                  <td>{{ user.username }}</td>
                  <td>{{ user.firstName }}</td>
                  <td>{{ user.lastName }}</td>
                  <td>{{ user.email }}</td>
                  <td>{{ user.matricule }}</td>
                  <td>{{ user.address }}</td>
                  <td>{{ user.phoneNumber }}</td>

                 <!-- Actions -->
             <!-- Actions -->
                  <td>
                    <ul class="list-inline font-size-20 contact-links mb-0">
                      <li class="list-inline-item px-2">
                        <a (click)="deleteUser(user.idUserprofile)" ngbTooltip="Supprimer">
                          <i class="bx bx-trash"></i>
                        </a>
                      </li>
                      <li class="list-inline-item px-2">
                        <a [routerLink]="['/contacts/profile', user.idUserprofile]" ngbTooltip="Profile">
                          <i class="bx bx-user-circle"></i>
                        </a>
                      </li>

                    </ul>
                  </td>



                </tr>
              </tbody>
            </table>
          </div>

          <!-- Pagination -->
          <div class="row">
            <div class="col-lg-12 text-center mt-3">
              <nav aria-label="Page navigation">
                <ul class="pagination pagination-rounded justify-content-center">
                  <li class="page-item disabled">
                    <a class="page-link" href="#"><i class="mdi mdi-chevron-left"></i></a>
                  </li>
                  <li class="page-item active"><a class="page-link" href="#">1</a></li>
                  <li class="page-item"><a class="page-link" href="#">2</a></li>
                  <li class="page-item"><a class="page-link" href="#">3</a></li>
                  <li class="page-item">
                    <a class="page-link" href="#"><i class="mdi mdi-chevron-right"></i></a>
                  </li>
                </ul>
              </nav>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
