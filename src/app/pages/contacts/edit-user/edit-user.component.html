
<div class="container-fluid">
  <app-page-title title="Mettre à jour profil" [breadcrumbItems]="breadCrumbItems"></app-page-title>

  <div class="row">
    <div class="col-lg-12">
      <div class="card">
        <div class="card-body">
          <aw-wizard [navBarLayout]="'large-empty-symbols'">
            <!-- Étape 1 -->
            <aw-wizard-step stepTitle="Infos de Connexion">
              <ng-template awWizardStepSymbol><i class="fas fa-user"></i></ng-template>
              <div class="row">
                <div class="col-md-6">
                  <label>Email</label>
                  <input class="form-control" [(ngModel)]="user.email" name="email" type="email" />
                </div>
               
              </div>
              <ul class="list-inline wizard mt-4">
                <li class="next list-inline-item float-end">
                  <button class="btn btn-primary" awNextStep>Suivant</button>
                </li>
              </ul>
            </aw-wizard-step>

            <!-- Étape 2 -->
            <aw-wizard-step stepTitle="Informations personnelles">
              <ng-template awWizardStepSymbol><i class="fas fa-id-card"></i></ng-template>
              <div class="row">
                <div class="col-md-6">
                  <label>Prénom</label>
                  <input class="form-control" [(ngModel)]="user.firstName" name="firstName" type="text" />
                </div>
                <div class="col-md-6">
                  <label>Nom</label>
                  <input class="form-control" [(ngModel)]="user.lastName" name="lastName" type="text" />
                </div>
              </div>
              <div class="row mt-3">
                <div class="col-md-6">
                  <label>Matricule</label>
                  <input class="form-control" [(ngModel)]="user.matricule" name="matricule" type="text" />
                </div>
                <div class="col-md-6">
                  <label>Téléphone</label>
                  <input class="form-control" [(ngModel)]="user.phoneNumber" name="phoneNumber" type="text" />
                </div>
              </div>
              <ul class="list-inline wizard mt-4">
                <li class="previous list-inline-item"><button class="btn btn-secondary" awPreviousStep>Précédent</button></li>
                <li class="next list-inline-item float-end"><button class="btn btn-primary" awNextStep>Suivant</button></li>
              </ul>
            </aw-wizard-step>

            <!-- Étape 3 -->
            <aw-wizard-step stepTitle="Adresse">
              <ng-template awWizardStepSymbol><i class="fas fa-map-marker-alt"></i></ng-template>
              <div class="row">
                <div class="col-md-12">
                  <label>Adresse</label>
                  <input class="form-control" [(ngModel)]="user.address" name="address" type="text" />
                </div>
              </div>
              <ul class="list-inline wizard mt-4">
                <li class="previous list-inline-item"><button class="btn btn-secondary" awPreviousStep>Précédent</button></li>
                <li class="next list-inline-item float-end"><button class="btn btn-primary" awNextStep>Suivant</button></li>
              </ul>
            </aw-wizard-step>

            <!-- Étape 4 -->
            <aw-wizard-step stepTitle="Confirmation">
              <ng-template awWizardStepSymbol><i class="fas fa-check-circle"></i></ng-template>
              <div class="text-center mt-4">
                <h5>Voulez-vous enregistrer les modifications ?</h5>
              </div>
              <ul class="list-inline wizard mt-4">
                <li class="previous list-inline-item"><button class="btn btn-secondary" awPreviousStep>Précédent</button></li>
                <li class="list-inline-item float-end">
                  <button class="btn btn-success" (click)="onUpdate()">Mettre à jour</button>
                </li>
              </ul>
            </aw-wizard-step>
          </aw-wizard>
        </div>
      </div>
    </div>
  </div>
</div>
