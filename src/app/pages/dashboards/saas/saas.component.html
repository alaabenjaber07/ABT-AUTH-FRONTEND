<app-loader></app-loader>
<div class="container-fluid">

  

  <!-- ✅ ROW 1 : COUNTS -->
  <div class="row">
    <!-- Nombre Total de Virements -->
    <div class="col-sm-4">
      <div class="card">
        <div class="card-body">
          <div class="d-flex align-items-center mb-3">
            <div class="avatar-xs me-3">
              <span class="avatar-title rounded-circle bg-white" style="color:#FF7F00; font-size:18px;">
                <i class="bx bx-copy-alt"></i>
              </span>
            </div>
            <h5 class="font-size-14 mb-0">Nombre Total de Virements</h5>
          </div>
          <div class="text-muted mt-4">
            <h4>{{ nombreTotal }}</h4>
            <div class="d-flex">
              <span class="badge badge-soft-success font-size-12">+0%</span>
              <span class="ms-2 text-truncate">Par rapport à hier</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Effets -->
    <div class="col-sm-4">
      <div class="card">
        <div class="card-body">
          <div class="d-flex align-items-center mb-3">
            <div class="avatar-xs me-3">
              <span class="avatar-title rounded-circle bg-white" style="color:#FF7F00; font-size:18px;">
                <i class="bx bx-file"></i>
              </span>
            </div>
            <h5 class="font-size-14 mb-0">Effets</h5>
          </div>
          <div class="text-muted mt-4">
            <h4>{{ effetCount }}</h4>
            <div class="d-flex">
              <span class="badge badge-soft-success font-size-12">+0%</span>
              <span class="ms-2 text-truncate">Par rapport à hier</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Utilisateurs -->
    <div class="col-sm-4">
      <div class="card">
        <div class="card-body">
          <div class="d-flex align-items-center mb-3">
            <div class="avatar-xs me-3">
              <span class="avatar-title rounded-circle bg-white" style="color:#FF7F00; font-size:18px;">
                <i class="bx bx-user"></i>
              </span>
            </div>
            <h5 class="font-size-14 mb-0">Utilisateurs</h5>
          </div>
          <div class="text-muted mt-4">
            <h4>{{ userCount }}</h4>
            <div class="d-flex">
              <span class="badge badge-soft-success font-size-12">+0%</span>
              <span class="ms-2 text-truncate">Par rapport à hier</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ✅ ROW 2 : DONUTS -->
  <div class="row">
    <!-- Virements par Instruction -->
    <div class="col-xl-6">
      <div class="card">
        <div class="card-body">
          <h4 class="card-title mb-4">Virements par Instruction</h4>
          <apx-chart class="apex-charts" dir="ltr"
            [series]="salesAnalyticsDonutChart.series"
            [chart]="salesAnalyticsDonutChart.chart"
            [colors]="salesAnalyticsDonutChart.colors"
            [plotOptions]="salesAnalyticsDonutChart.plotOptions"
            [legend]="salesAnalyticsDonutChart.legend"
            [labels]="salesAnalyticsDonutChart.labels">
          </apx-chart>
        </div>
      </div>
    </div>
    

    <!-- Effets par Type -->
    <div class="col-xl-6">
      <div class="card">
        <div class="card-body">
          <h4 class="card-title mb-4">Effets par Type</h4>
          <apx-chart *ngIf="EffetsTypeDonutChart"
            class="apex-charts"
            dir="ltr"
            [series]="EffetsTypeDonutChart.series"
            [chart]="EffetsTypeDonutChart.chart"
            [colors]="EffetsTypeDonutChart.colors"
            [plotOptions]="EffetsTypeDonutChart.plotOptions"
            [legend]="EffetsTypeDonutChart.legend"
            [labels]="EffetsTypeDonutChart.labels">
          </apx-chart>
        </div>
      </div>
    </div>
  </div>
<!-- ✅ ROW : Effets par Etat seule -->
<div class="row">
  <div class="col-xl-12">
    <div class="card">
      <div class="card-body">
        <h4 class="card-title mb-4">Effets par Etat</h4>
        <apx-chart *ngIf="salesDonutChart"
          class="apex-charts"
          dir="ltr"
          [series]="salesDonutChart.series"
          [chart]="salesDonutChart.chart"
          [colors]="salesDonutChart.colors"
          [plotOptions]="salesDonutChart.plotOptions"
          [legend]="salesDonutChart.legend"
          [labels]="salesDonutChart.labels">
        </apx-chart>
      </div>
    </div>
  </div>
</div>


  <!-- Virements -->
  <div class="row">
    <div class="col-xl-12">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Virements (Evolution)</h5>
          <apx-chart dir="ltr" class="apex-charts"
            [chart]="visitorsOptions.chart"
            [series]="visitorsOptions.series"
            [legend]="visitorsOptions.legend"
            [colors]="['#FF7F00']"
            [fill]="visitorsOptions.fill"
            [dataLabels]="visitorsOptions.dataLabels"
            [xaxis]="visitorsOptions.xaxis"
            [stroke]="visitorsOptions.stroke">
          </apx-chart>
        </div>
      </div>
    </div>
  </div>

  <!-- Effets -->
  <div class="row">
    <div class="col-xl-12">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Effets</h5>
          <apx-chart class="apex-charts" dir="ltr"
            [series]="earningLineChart.series"
            [chart]="earningLineChart.chart"
            [colors]="earningLineChart.colors"
            [stroke]="earningLineChart.stroke"
            [dataLabels]="earningLineChart.dataLabels"
            [xaxis]="earningLineChart.xaxis"
            [yaxis]="earningLineChart.yaxis">
          </apx-chart>
        </div>
      </div>
    </div>
  </div>
</div>
