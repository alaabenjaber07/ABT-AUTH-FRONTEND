<div class="card">
  <div class="card-body">
    <h4 class="card-title mb-4">Modifier le mot de passe</h4>
    
    <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">

      <div class="row mb-3">
        <label class="col-sm-3 col-form-label">Mot de passe actuel *</label>
        <div class="col-sm-9">
          <input type="password" class="form-control" formControlName="currentPassword" placeholder="Mot de passe actuel">
        </div>
      </div>

      <div class="row mb-3">
        <label class="col-sm-3 col-form-label">Nouveau mot de passe *</label>
        <div class="col-sm-9">
          <input type="password" class="form-control" formControlName="newPassword" placeholder="Nouveau mot de passe">
        </div>
      </div>

      <div class="row mb-3">
        <label class="col-sm-3 col-form-label">Confirmer le mot de passe *</label>
        <div class="col-sm-9">
          <input type="password" class="form-control" formControlName="confirmPassword" placeholder="Confirmer le mot de passe">
          <div *ngIf="passwordForm.errors?.mismatch" class="text-danger mt-1">
            Les mots de passe ne correspondent pas
          </div>
        </div>
      </div>

      <div class="d-flex justify-content-between mt-3">
        <button type="button" class="btn btn-secondary" (click)="onReset()">Annuler</button>
        <button type="submit" class="btn btn-warning" [disabled]="passwordForm.invalid">Mettre à jour</button>
      </div>

    </form>
  </div>
</div>
